name: Build Timelapse Current V13 Packet Monitor x86 DLL

on:
  push:
    branches: [main]
    paths:
      - timelapse-v13-packet-monitor-full.patch
      - .github/workflows/build-current-v13.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timelapse-current-v13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Download upstream source
        shell: pwsh
        run: |
          git init source
          git -C source remote add origin https://github.com/jnpl95/Timelapse.git
          git -C source fetch --depth 1 origin dd2e7619da4a5ca647f0cff8f9ce28ed7dc068f8
          git -C source checkout --detach FETCH_HEAD

      - name: Apply consolidated Timelapse V13 patch
        shell: pwsh
        run: |
          $patchPath = Join-Path $env:GITHUB_WORKSPACE 'timelapse-v13-packet-monitor-full.patch'
          if (-not (Test-Path -LiteralPath $patchPath)) {
            throw 'timelapse-v13-packet-monitor-full.patch is missing from the repository root.'
          }

          $patchText = [System.IO.File]::ReadAllText($patchPath)
          $patchText = $patchText.Replace("`r`n", "`n").Replace("`r", "`n")
          [System.IO.File]::WriteAllText(
            $patchPath,
            $patchText,
            [System.Text.UTF8Encoding]::new($false)
          )

          $expectedHash = 'a9e872b232e053640e7eea73049fd665386665cb1b635a973b99065626232f75'
          $actualHash = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Wrong V13 patch. Expected SHA256 $expectedHash, got $actualHash."
          }

          git -C source apply --check $patchPath
          git -C source apply $patchPath

      - name: Retarget project for Visual Studio 2022
        shell: pwsh
        run: |
          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'source\Timelapse\Timelapse.vcxproj'
          $project = Get-Content -LiteralPath $projectPath -Raw
          $project = $project.Replace(
            '<WindowsTargetPlatformVersion>10.0.17763.0</WindowsTargetPlatformVersion>',
            "<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>`r`n    <TargetFrameworkVersion>v4.8</TargetFrameworkVersion>"
          )
          $project = $project.Replace(
            '<PlatformToolset>v141</PlatformToolset>',
            '<PlatformToolset>v143</PlatformToolset>'
          )
          Set-Content -LiteralPath $projectPath -Value $project -Encoding utf8

          $resourcePath = Join-Path $env:GITHUB_WORKSPACE 'source\Timelapse\Timelapse.rc'
          $resource = Get-Content -LiteralPath $resourcePath -Raw
          $oldIconPath = 'D:\\JP\\Desktop\\Timelapse\\Timelapse.ico'
          if (-not $resource.Contains($oldIconPath)) {
            throw 'The expected original icon path was not found in Timelapse.rc.'
          }
          $resource = $resource.Replace($oldIconPath, '..\\Timelapse.ico')
          Set-Content -LiteralPath $resourcePath -Value $resource -Encoding unicode

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86 DLL
        shell: cmd
        run: msbuild source\Timelapse.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x86 /p:PreferredToolArchitecture=x64

      - name: Collect and verify DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Recurse -Filter Timelapse.dll |
            Select-Object -First 1
          if (-not $dll) {
            throw 'Timelapse.dll was not produced.'
          }

          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) {
            throw ('Expected x86 PE machine 0x014c, got 0x{0:X4}.' -f $machine)
          }

          $artifactPath = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Path $artifactPath -Force | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $artifactPath 'Timelapse.dll')
          Get-FileHash -Algorithm SHA256 (Join-Path $artifactPath 'Timelapse.dll') | Format-List

      - name: Upload Timelapse V13 DLL
        uses: actions/upload-artifact@v4
        with:
          name: Timelapse-v83-x86-v13-packet-monitor
          path: artifact/Timelapse.dll
          if-no-files-found: error
          retention-days: 7
