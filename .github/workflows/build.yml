name: Build Timelapse x86 DLL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Download upstream source
        shell: pwsh
        run: git clone --depth 1 https://github.com/jnpl95/Timelapse.git source

      - name: Retarget project for Visual Studio 2022
        shell: pwsh
        run: |
          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'source\Timelapse\Timelapse.vcxproj'
          $project = Get-Content -LiteralPath $projectPath -Raw
          $project = $project.Replace(
            '<WindowsTargetPlatformVersion>10.0.17763.0</WindowsTargetPlatformVersion>',
            "<WindowsTargetPlatformVersion>10.0</WindowsTargetPlatformVersion>`r`n    <TargetFrameworkVersion>v4.8</TargetFrameworkVersion>"
          )
          $project = $project.Replace(
            '<PlatformToolset>v141</PlatformToolset>',
            '<PlatformToolset>v143</PlatformToolset>'
          )
          Set-Content -LiteralPath $projectPath -Value $project -Encoding utf8

          $resourcePath = Join-Path $env:GITHUB_WORKSPACE 'source\Timelapse\Timelapse.rc'
          $resource = Get-Content -LiteralPath $resourcePath -Raw
          $resource = $resource.Replace(
            'D:\\JP\\Desktop\\Timelapse\\Timelapse.ico',
            '..\\Timelapse.ico'
          )
          Set-Content -LiteralPath $resourcePath -Value $resource -Encoding unicode

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86 DLL
        shell: cmd
        run: msbuild source\Timelapse.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x86 /p:PreferredToolArchitecture=x64

      - name: Collect and verify DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Recurse -Filter Timelapse.dll |
            Select-Object -First 1
          if (-not $dll) {
            throw 'Timelapse.dll was not produced.'
          }
          New-Item -ItemType Directory -Path (Join-Path $env:GITHUB_WORKSPACE 'artifact') -Force | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE 'artifact\Timelapse.dll')
          Get-FileHash -Algorithm SHA256 (Join-Path $env:GITHUB_WORKSPACE 'artifact\Timelapse.dll') | Format-List
        

      - name: Upload Timelapse DLL
        uses: actions/upload-artifact@v4
        with:
          name: Timelapse-v83-x86
          path: artifact/Timelapse.dll
          if-no-files-found: error
          retention-days: 7
